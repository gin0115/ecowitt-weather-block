<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wind-a" x1="138.5" x2="224.2" y1="5.1" y2="153.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4d7dd"/>
      <stop offset=".5" stop-color="#d4d7dd"/>
      <stop offset="1" stop-color="#bec1c6"/>
    </linearGradient>
    <linearGradient xlink:href="#wind-a" id="wind-b" x1="77.7" x2="169" y1="96.2" y2="254.4"/>
    <symbol id="wind-lines" viewBox="0 0 348 240">
      <path fill="none" stroke="url(#wind-a)" stroke-dasharray="148" stroke-linecap="round" stroke-miterlimit="10" stroke-width="24" d="M267.2 24.3A40 40 0 11296 92H12">
        <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="0; 2960"/>
      </path>
      <path fill="none" stroke="url(#wind-b)" stroke-dasharray="110" stroke-linecap="round" stroke-miterlimit="10" stroke-width="24" d="M151.2 215.7A40 40 0 10180 148H12">
        <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="0; 1540"/>
      </path>
    </symbol>
  </defs>

  <!-- Wrap everything in a group and shift up to center vertically -->
  <g transform="translate(0 -60)">
    <!-- Wind curves -->
    <use xlink:href="#wind-lines" width="348" height="240" transform="translate(82 240)"/>

    <!-- Pressure arrow 1 -->
    <g transform="translate(-40 30) scale(4.5)">
      <path fill="none" stroke="#2885c7" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M32 20v24l-5.79-6.89L32 44l5.78-6.89">
        <animateTransform attributeName="transform" begin="0s" dur="1.5s" keyTimes="0.0; 0.5; 0.9; 1.0" repeatCount="indefinite" type="translate" values="0 0; 0 0; 0 9; 0 9"/>
        <animate attributeName="opacity" dur="1.5s" keyTimes="0.0; 0.3; 0.8; 0.9; 1.0" repeatCount="indefinite" values="0; 1; 1; 0; 0"/>
      </path>
    </g>

    <!-- Pressure arrow 2 -->
    <g transform="translate(85 30) scale(4.5)">
      <path fill="none" stroke="#2885c7" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M32 20v24l-5.79-6.89L32 44l5.78-6.89">
        <animateTransform attributeName="transform" begin="0.3s" dur="1.5s" keyTimes="0.0; 0.5; 0.9; 1.0" repeatCount="indefinite" type="translate" values="0 0; 0 0; 0 9; 0 9"/>
        <animate attributeName="opacity" dur="1.5s" begin="0.3s" keyTimes="0.0; 0.3; 0.8; 0.9; 1.0" repeatCount="indefinite" values="0; 1; 1; 0; 0"/>
      </path>
    </g>
  </g>
</svg>
